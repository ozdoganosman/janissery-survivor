name: Deploy to GitHub Pages

on:
  push:
    # `main` is the intended long-term target. The feature branch is listed because
    # it is currently the repository's default branch — the repo was created empty,
    # so the first push defined the default. Drop it once `main` exists.
    branches:
      - main
      - claude/yeniceeri-vampire-survivors-game-51qjs6
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  # Required by deploy-pages: it exchanges an OIDC token rather than a stored secret.
  id-token: write

# Never let two deploys race; a half-finished deploy would serve a broken build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Deploy only what has passed the same gate as CI. Publishing a build that
      # fails typecheck or tests defeats the point of having them.
      - name: Run checks
        run: npm run check

      - name: Build
        run: npm run build

      # Requires Pages to already be enabled on the repository, with the build
      # source set to GitHub Actions (Settings -> Pages -> Source: GitHub Actions).
      # That is a one-time manual step and cannot be automated from here: creating a
      # Pages site needs repository admin rights, which the workflow's GITHUB_TOKEN
      # does not have even with `permissions: pages: write`. Passing
      # `enablement: true` was tried and fails with "Create Pages site failed:
      # Resource not accessible by integration".
      #
      # Until that switch is flipped, this workflow fails here on every push. That
      # failure is the intended signal that deployment is not configured yet.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
